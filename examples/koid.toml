# koid configuration: one [targets.NAME] table per machine.

[daemon]
socket = "/run/koidaemon/koid.sock"
socket_mode = "0660"
# socket_group = "koid"

# Port 1 of a first-generation Raritan Dominion KX switch.
[targets.board-a]
backend = "raritan-legacy"
host = "192.0.2.10"
port = 1
password_file = "/run/secrets/raritan"
wait = 30

# A board behind a PiKVM.
[targets.board-b]
backend = "pikvm"
url = "https://192.0.2.20"
password_file = "/run/secrets/pikvm-b"
ca_file = "pikvm-b.pem"

# A board behind a NanoKVM-USB plugged into this machine.
[targets.board-c]
backend = "nanokvm-usb"
serial = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXXXX-if00"
video = "/dev/v4l/by-id/usb-MACROSILICON_USB3_Video_XXXXXXXX-video-index0"

# A board behind a Radxa Linkr.
[targets.board-d]
backend = "linkr"
url = "https://192.0.2.30"
token_file = "/run/secrets/linkr"
ca_file = "linkr.pem"
