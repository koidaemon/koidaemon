[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koidaemon"
version = "0.1.0"
description = "A daemon that drives the keyboard, mouse, screen and USB storage of machines behind KVM-over-IP devices"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matt H", email = "code@mattface.org" }]
requires-python = ">=3.11"
# cryptography does the RSA step of the raritan-legacy backend's SSL 3.0
# handshake; everything else uses only the standard library.
dependencies = ["cryptography"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
koid = "koidaemon.cli:koid"
koictl = "koidaemon.cli:koictl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
